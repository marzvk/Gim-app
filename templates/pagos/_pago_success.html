<script>
    document.getElementById('modal-container').innerHTML = '';

    const alertaExito = document.createElement('div');
    alertaExito.className = 'alert alert-success alert-dismissible fade show position-fixed top-0 start-50 translate-middle-x mt-3 shadow';
    alertaExito.style.zIndex = '9999';
    alertaExito.innerHTML = `
        <i class="bi bi-check-circle-fill me-2"></i>Pago registrado exitosamente
        <button type="button" class="btn-close" onclick="this.parentElement.remove()"></button>
    `;
    document.body.appendChild(alertaExito);
    
    setTimeout(function() { alertaExito.remove(); }, 3000);
    
    htmx.ajax('GET', window.location.search || '/', {
        target: '#clientes-container',
        swap: 'innerHTML'
    });
</script>
