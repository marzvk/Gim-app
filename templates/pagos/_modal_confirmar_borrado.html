<div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">
                    <span class="title-icon red"><i class="bi bi-trash-fill"></i></span>
                    Confirmar borrado
                </h5>
                <button type="button" class="btn-close close-modal" aria-label="Cerrar"></button>
            </div>

            <div class="modal-body">
                <p class="mb-3">¿Estás seguro de eliminar este pago? Esta acción no se puede deshacer.</p>
                <div class="p-3 bg-light rounded-3">
                    <div class="d-flex align-items-center gap-3">
                        <div class="bg-danger-subtle text-danger rounded-2 d-flex align-items-center justify-content-center" style="width:40px;height:40px;">
                            <i class="bi bi-cash-stack"></i>
                        </div>
                        <div>
                            <div class="fw-semibold">{{ pago.cliente.apellido }}, {{ pago.cliente.nombre }}</div>
                            <small class="text-muted">
                                Mes: {{ pago.mes_cubierto|date:"m/Y" }} — Monto: ${{ pago.monto|floatformat:0 }}
                            </small>
                        </div>
                    </div>
                </div>
            </div>

            <div class="modal-footer">
                <button type="button" class="btn btn-outline-secondary close-modal">
                    <i class="bi bi-x-lg me-1"></i>Cancelar
                </button>
                <form hx-post="{% url 'borrar_pago' pago.id %}" hx-target="#modal-container">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger">
                        <i class="bi bi-trash-fill me-1"></i>Sí, borrar
                    </button>
                </form>
            </div>
        </div>
